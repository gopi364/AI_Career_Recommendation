
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Details | AI Career</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 16px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f8fafc;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(139, 92, 246, 0.30),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(20, 184, 166, 0.20),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #080d20,
                    #111b38,
                    #10152e
                );

            background-attachment: fixed;
        }

        /* Main glass box with multicolour border */
        .container {
            position: relative;
            width: 100%;
            max-width: 650px;
            margin: 15px auto;
            padding: 35px 38px;

            border: 3px solid transparent;
            border-radius: 24px;

            background:
                linear-gradient(
                    rgba(20, 28, 53, 0.97),
                    rgba(20, 28, 53, 0.97)
                ) padding-box,
                conic-gradient(
                    from var(--border-angle, 0deg),
                    #00f5ff,
                    #6366f1,
                    #c026d3,
                    #14b8a6,
                    #00f5ff
                ) border-box;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 0 15px rgba(0, 245, 255, 0.18),
                0 0 28px rgba(139, 92, 246, 0.15),
                0 20px 50px rgba(0, 0, 0, 0.25);

            animation: appear 0.7s ease,
                       boxGlow 5s ease-in-out infinite;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes boxGlow {
            0%, 100% {
                box-shadow:
                    0 0 12px rgba(0, 245, 255, 0.15),
                    0 0 22px rgba(139, 92, 246, 0.12),
                    0 20px 50px rgba(0, 0, 0, 0.25);
            }

            50% {
                box-shadow:
                    0 0 20px rgba(0, 245, 255, 0.25),
                    0 0 35px rgba(192, 38, 211, 0.18),
                    0 20px 50px rgba(0, 0, 0, 0.25);
            }
        }

        /* Heading icon */
        .top-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 29px;
            border-radius: 18px;

            background: rgba(94, 234, 212, 0.10);
            border: 1px solid rgba(94, 234, 212, 0.35);

            box-shadow: 0 0 18px rgba(94, 234, 212, 0.10);
        }

        h1 {
            margin: 0;
            text-align: center;
            color: #5eead4;
            font-size: 29px;
            letter-spacing: 0.4px;

            text-shadow: 0 0 12px rgba(94, 234, 212, 0.18);
        }

        .subtitle {
            margin: 12px 0 26px;
            text-align: center;
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.7;
        }

        /* Form labels */
        label {
            display: block;
            margin: 17px 0 8px;
            color: #f1f5f9;
            font-size: 13px;
            font-weight: 600;
        }

        /* Input fields */
        input,
        select,
        textarea {
            display: block;
            width: 100%;
            padding: 12px 13px;

            border: 1px solid rgba(148, 163, 184, 0.40);
            border-radius: 11px;

            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;

            font-size: 13px;
            font-family: inherit;
            outline: none;

            transition:
                border-color 0.25s,
                box-shadow 0.25s,
                background 0.25s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #aebbd2;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #5eead4;
            background: rgba(255, 255, 255, 0.09);

            box-shadow:
                0 0 0 3px rgba(94, 234, 212, 0.10),
                0 0 14px rgba(94, 234, 212, 0.10);
        }

        /* Dropdown options */
        select option {
            background: #172b4d;
            color: #ffffff;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .note {
            margin: 7px 0 0;
            color: #aebbd2;
            font-size: 12px;
        }

        /* Submit button */
        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;

            border: 1px solid rgba(94, 234, 212, 0.35);
            border-radius: 11px;

            background: linear-gradient(
                135deg,
                #0d9488,
                #14b8a6
            );

            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;

            transition:
                transform 0.25s,
                box-shadow 0.25s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 15px rgba(20, 184, 166, 0.30),
                0 8px 22px rgba(20, 184, 166, 0.20);
        }

        button:active {
            transform: translateY(0);
        }

        /* Mobile responsive */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
            }

            .container {
                padding: 27px 20px;
                border-radius: 20px;
                border-width: 3px;
            }

            h1 {
                font-size: 25px;
            }

            .subtitle {
                font-size: 12px;
            }

            input,
            select,
            textarea {
                padding: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .container {
                animation: none;
            }

            input,
            select,
            textarea,
            button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="top-icon">🎓</div>

        <h1>Student Details</h1>

        <p class="subtitle">
            Tell us about your education and skills
            to receive career recommendations.
        </p>

        <form method="POST"
              action="{{ url_for('student_details') }}">

            <label for="full_name">Full Name</label>
            <input
                type="text"
                id="full_name"
                name="full_name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >

            <label for="age">Age</label>
            <input
                type="number"
                id="age"
                name="age"
                min="16"
                max="100"
                placeholder="Enter your age"
                required
            >

            <label for="education">Education</label>
            <select id="education" name="education" required>
                <option value="">Select your education</option>
                <option value="B.Tech">B.Tech</option>
                <option value="B.Sc">B.Sc</option>
                <option value="BCA">BCA</option>
                <option value="M.Tech">M.Tech</option>
                <option value="M.Sc">M.Sc</option>
                <option value="MCA">MCA</option>
                <option value="Other">Other</option>
            </select>

            <label for="college">College Name</label>
            <input
                type="text"
                id="college"
                name="college"
                placeholder="Enter your college name"
                required
            >

            <label for="graduation_year">Graduation Year</label>
            <select
                id="graduation_year"
                name="graduation_year"
                required
            >
                <option value="">Select graduation year</option>
                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
            </select>

            <label for="skills">Technical Skills</label>
            <textarea
                id="skills"
                name="skills"
                placeholder="Example: Java, Python, SQL, HTML, CSS"
                required
            ></textarea>

            <p class="note">
                Separate your skills with commas.
            </p>

            <label for="experience">Experience / Projects</label>
            <textarea
                id="experience"
                name="experience"
                placeholder="Describe your internships, projects or experience"
            ></textarea>

            <button type="submit">
                Save Details &amp; Continue →
            </button>

        </form>

    </main>

</body>
</html>
