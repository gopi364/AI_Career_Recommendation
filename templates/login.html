
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | AI Career</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --cyan: #39f5ff;
    --purple: #d946ef;
    --muted: #9aaabe;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #eafaff;
    background: radial-gradient(
        ellipse at center,
        #142b3d 0%, #091521 55%, #030810 100%
    );
}

/* Animated neon circle */
.neon-circle {
    position: fixed;
    top: 50%;
    left: 50%;
    width: min(600px, 85vw);
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border: 3px solid transparent;
    border-radius: 50%;
    background:
        linear-gradient(#08131f, #08131f) padding-box,
        conic-gradient(
            from 0deg,
            var(--cyan),
            #178bff,
            var(--purple),
            #247dff,
            var(--cyan)
        ) border-box;
    box-shadow:
        0 0 12px rgba(57, 245, 255, .65),
        0 0 38px rgba(57, 245, 255, .32),
        0 0 75px rgba(66, 165, 255, .18);
    animation: rotateGlow 14s linear infinite,
               breathe 3s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
}

@keyframes rotateGlow {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
        transform: translate(-50%, -50%) rotate(360deg);
    }
}

@keyframes breathe {
    0%, 100% { filter: brightness(.9); }
    50% { filter: brightness(1.3); }
}

/* Transparent login form */
.login-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 410px;
    padding: 30px 28px;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
    animation: slideUp .8s ease both;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(22px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.login-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    border-radius: 50%;
    background: rgba(57, 245, 255, .08);
    border: 1px solid rgba(57, 245, 255, .45);
    box-shadow: 0 0 20px rgba(57, 245, 255, .15);
}

h1 {
    margin: 0;
    text-align: center;
    color: var(--cyan);
    font-size: 30px;
    letter-spacing: 2px;
    text-shadow: 0 0 16px rgba(57, 245, 255, .5);
}

.subtitle {
    margin: 10px 0 27px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
}

label {
    display: block;
    margin: 19px 0 8px;
    color: #dce9f6;
    font-size: 13px;
    font-weight: 600;
}

input {
    display: block;
    width: 100%;
    min-width: 0;
    padding: 14px 17px;
    border: 1px solid rgba(120, 160, 190, .2);
    border-radius: 28px;
    outline: none;
    color: white;
    background: rgba(1, 9, 17, .92);
    font-size: 14px;
    transition: border-color .3s, box-shadow .3s;
}

input::placeholder {
    color: #7f91a5;
}

input:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 13px rgba(57, 245, 255, .22);
}

.password-wrapper {
    position: relative;
}

.password-wrapper input {
    padding-right: 48px;
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 13px;
    transform: translateY(-50%);
    padding: 4px;
    border: none;
    background: transparent;
    color: #b8d6e6;
    font-size: 18px;
    cursor: pointer;
}

.toggle-password:hover {
    color: var(--cyan);
}

.login-submit {
    width: 100%;
    margin-top: 28px;
    padding: 14px;
    border: 1px solid rgba(57, 245, 255, .65);
    border-radius: 28px;
    color: #eaffff;
    background: linear-gradient(
        110deg,
        rgba(15, 83, 111, .9),
        rgba(18, 66, 91, .95)
    );
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform .3s, box-shadow .3s;
}

.login-submit:hover {
    transform: translateY(-2px);
    box-shadow:
        0 0 15px rgba(57, 245, 255, .3),
        0 0 30px rgba(57, 245, 255, .12);
}

.register-link {
    margin: 23px 0 0;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
}

a {
    display: inline-block;
    margin-top: 6px;
    color: var(--cyan);
    font-weight: 700;
    text-decoration: none;
}

a:hover {
    text-shadow: 0 0 12px var(--cyan);
}

@media (max-width: 500px) {
    .login-card {
        padding: 24px 18px;
    }

    .neon-circle {
        width: 115vw;
    }

    h1 {
        font-size: 26px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="neon-circle" aria-hidden="true"></div>

<main class="login-card">

    <div class="login-icon">🔐</div>

    <h1>WELCOME</h1>

    <p class="subtitle">
        Login to your account
    </p>

    <form method="POST" action="{{ url_for('login') }}">

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Email Address"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>

        <div class="password-wrapper">
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                class="toggle-password"
                onclick="togglePassword('password', this)"
                aria-label="Show password"
                aria-pressed="false"
            >👁</button>
        </div>

        <button type="submit" class="login-submit">
            LOGIN →
        </button>

    </form>

    <p class="register-link">
        Don't have an account?<br>
        <a href="{{ url_for('register') }}">Sign Up →</a>
    </p>

</main>

<script>
function togglePassword(inputId, button) {
    const input = document.getElementById(inputId);
    const isHidden = input.type === "password";

    input.type = isHidden ? "text" : "password";
    button.textContent = isHidden ? "🙈" : "👁";

    button.setAttribute(
        "aria-label",
        isHidden ? "Hide password" : "Show password"
    );

    button.setAttribute("aria-pressed", String(isHidden));
}
</script>

</body>
</html>
